spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tomatomall?characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true
    username: yourname
    password: yourpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
        hibernate:
          dialect: org.hibernate.dialect.MySQL8Dialect
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  # 增加 HTTP 请求体大小限制（支持 Base64 大图片）
  codec:
    max-in-memory-size: 20MB

server:
  port: 8080
  # 增加 Tomcat 请求体大小限制
  tomcat:
    max-http-post-size: 20MB

aliyun:
  oss:
    file:
      endpoint: oss-cn-beijing.aliyuncs.com
      keyid: yourKeyID 
      keysecret: yourKeySercret
      bucketname: yourBucketname
