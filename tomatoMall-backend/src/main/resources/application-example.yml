# Copy to the ignored application.yml and supply credentials through environment variables.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tomatomall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:tomatomall}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${OPENAI_MODEL:deepseek-v4-flash}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: 8080
aliyun:
  oss:
    file:
      endpoint: ${OSS_ENDPOINT}
      keyid: ${OSS_KEY_ID}
      keysecret: ${OSS_KEY_SECRET}
      bucketname: ${OSS_BUCKET}
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    embedding:
      model: ${EMBEDDING_MODEL:text-embedding-v4}
      dimensions: ${EMBEDDING_DIMENSIONS:1024}
alipay:
  app-id: ${ALIPAY_APP_ID}
  seller-id: ${ALIPAY_SELLER_ID}
  private-key: ${ALIPAY_PRIVATE_KEY}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY}
  server-url: ${ALIPAY_SERVER_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
  charset: UTF-8
  sign-type: RSA2
  notify-url: ${ALIPAY_NOTIFY_URL}
  return-url: ${ALIPAY_RETURN_URL:http://localhost:8080/api/orders/returnUrl}
orders:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mq:
    enabled: ${ORDER_MQ_ENABLED:true}
    endpoints: ${ROCKETMQ_ENDPOINTS:localhost:8081}
    topic: order-timeout
    consumer-group: order-timeout-consumer
    reconnect-ms: 10000
  outbox:
    poll-ms: 1000
  timeout:
    scan-ms: 60000
# Start PostgreSQL with compose.rag.yml and initialize infra/rag/init.sql first.
rag:
  retrieval:
    # Calibrated on the synthetic dev set; re-evaluate when model/catalog changes.
    min-similarity: ${RAG_MIN_SIMILARITY:0.54}
  vector:
    enabled: ${RAG_VECTOR_ENABLED:false}
    url: ${RAG_PG_URL:jdbc:postgresql://127.0.0.1:15432/tomatomall_vectors}
    username: ${RAG_PG_USER:tomatomall}
    password: ${RAG_PG_PASSWORD:}
    # Must identify the source MySQL catalog; do not share one index between demo and evaluation DBs.
    namespace: ${RAG_NAMESPACE:tomatomall}
  mq:
    enabled: ${RAG_MQ_ENABLED:false}
    topic: ${RAG_MQ_TOPIC:product-changed}
    consumer-group: ${RAG_MQ_GROUP:product-index-consumer}
  sync:
    initial-delay-ms: 30000
    interval-ms: 300000
