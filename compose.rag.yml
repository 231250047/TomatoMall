# Standalone derived search storage. MySQL remains the commerce database.
services:
  pgvector:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: tomatomall_vectors
      POSTGRES_USER: tomatomall
      POSTGRES_PASSWORD: ${RAG_PG_PASSWORD:?Set RAG_PG_PASSWORD in your local environment}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - rag-pgdata:/var/lib/postgresql/data
      - ./infra/rag/init.sql:/docker-entrypoint-initdb.d/01-rag.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tomatomall -d tomatomall_vectors"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  rag-pgdata:
