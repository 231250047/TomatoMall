# Local development only. Broker HTTP proxy is not mapped to avoid Spring Boot's port 8080.
services:
  namesrv:
    image: apache/rocketmq:5.3.2
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: -Xms128m -Xmx128m -Xmn64m
    ports:
      - "127.0.0.1:9876:9876"
  broker:
    image: apache/rocketmq:5.3.2
    depends_on:
      - namesrv
    command: sh mqbroker --enable-proxy -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    environment:
      NAMESRV_ADDR: namesrv:9876
      JAVA_OPT_EXT: -Xms512m -Xmx512m -Xmn128m
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:10911:10911"
    volumes:
      - ./infra/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
      - order-mq-store:/home/rocketmq/store
  mysql:
    image: mysql:8.0
    profiles: [database]
    environment:
      MYSQL_DATABASE: tomatomall
      MYSQL_USER: tomatomall
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-development-only}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-development-only}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - order-mysql:/var/lib/mysql
volumes:
  order-mq-store:
  order-mysql:
